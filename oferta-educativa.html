<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUACyD</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilo_landing_page.css">
    <style>

    </style>
</head>

<body>
    <header id="navbar-placeholder"></header>

    <!-- Banner con listón inferior - Página Oferta Educativa -->
    <section class="banner mt-0">
        <div class="container-fluid p-0 position-relative">
            <img src="resources/banner_duacyd.JPG" alt="Banner placeholder" class="img-fluid w-100"
                style="max-height: 500px; object-fit: cover;">
            <div class="custom-text-1 position-absolute bottom-0 start-0 w-100 p-4"
                style="background-color: #3e28a191;">
                <div class="container text-white">
                    <h1 class="fw-bold" style="color: var(--important-color);">Oferta Educativa</h1>
                    <h3>División de Universidad Abierta, Continua y a Distancia</h3>
                    <h4>Programas académicos diseñados para tu crecimiento profesional</h4>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- Contenido principal -->

    <script>
        // JavaScript con selectores actualizados
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.querySelector('.comp-1-container');
            if (!container) return;

            const boxes = container.querySelectorAll('.comp-1-box');

            // Verificar si es un dispositivo táctil
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints;

            if (isTouchDevice) {
                boxes.forEach(box => {
                    box.addEventListener('click', function (e) {
                        e.stopPropagation();

                        // Cerrar cualquier caja abierta primero
                        boxes.forEach(b => {
                            if (b !== box && b.classList.contains('comp-1-active')) {
                                b.classList.remove('comp-1-active');
                            }
                        });

                        // Alternar la clase active en la caja clickeada
                        box.classList.toggle('comp-1-active');
                    });
                });

                // Cerrar al hacer click fuera de las cajas
                document.addEventListener('click', function () {
                    boxes.forEach(box => {
                        box.classList.remove('comp-1-active');
                    });
                });
            }
        });
    </script>
    <script src="load-components.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
</body>

</html>
